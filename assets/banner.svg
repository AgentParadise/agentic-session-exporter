<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img"
     aria-label="agentic-session-exporter — reference client for the APS-V1-0004 Exporter profile. Three harnesses, five platforms.">
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#8b9bb4" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#veil)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#2dd4a7" opacity="0.5"/>

  <!-- Wordmark. The hyphens are muted so the three words read as one object. -->
  <text x="96" y="150" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace"
        font-size="46" letter-spacing="-1.2" fill="#e6edf3">agentic<tspan fill="#4a5568">-</tspan>session<tspan fill="#4a5568">-</tspan>exporter</text>

  <text x="98" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="19" fill="#8b9bb4">Reference client for the APS-V1-0004 Exporter profile</text>

  <!-- Callouts. Type only: a rule and a label, no chrome. -->
  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace" font-size="13" letter-spacing="1.4">
    <rect x="98" y="236" width="22" height="1.5" fill="#2dd4a7"/>
    <text x="132" y="241" fill="#2dd4a7">3 HARNESSES</text>
    <text x="252" y="241" fill="#3d4757">claude &#183; codex &#183; cursor</text>

    <rect x="98" y="268" width="22" height="1.5" fill="#2dd4a7"/>
    <text x="132" y="273" fill="#2dd4a7">5 PLATFORMS</text>
    <text x="252" y="273" fill="#3d4757">linux &#183; macos &#183; windows</text>
  </g>

  <!-- Three transcripts converge into one envelope, then leave.
       Small, thin, and right-aligned so it reads as a mark rather than a diagram. -->
  <g transform="translate(880,116)" fill="none" stroke-width="1.6">
    <g stroke="#3d4757">
      <rect x="0" y="0" width="34" height="24" rx="3"/>
      <rect x="0" y="42" width="34" height="24" rx="3"/>
      <rect x="0" y="84" width="34" height="24" rx="3"/>
      <path d="M8 8h18M8 14h12M8 50h18M8 56h14M8 92h18M8 98h11" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g stroke="#5b6b85">
      <path d="M34 12 C 74 12, 74 54, 114 54"/>
      <path d="M34 54 H 114"/>
      <path d="M34 96 C 74 96, 74 54, 114 54"/>
    </g>
    <g stroke="#2dd4a7">
      <rect x="114" y="34" width="40" height="40" rx="8"/>
      <path d="M122 46 l12 10 l12 -10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M154 54 H 196"/>
    </g>
    <path d="M196 46 l14 8 l-14 8 z" fill="#2dd4a7" stroke="none"/>
  </g>
</svg>
