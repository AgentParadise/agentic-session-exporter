name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Must match release.yml and release-gate.yml. The portability assertion
  # iterates this list, so a name missing here is a binary that ships
  # unchecked.
  BINARIES: >-
    apss-session-exporter apss-session-reconstitute
    SeshMagicSessionExporter SeshMagicSessionReconstitute

  # docs/REQUIREMENTS.md section 2. Not "high" - 100%, enforced here rather than
  # asserted in a document. This is a capture client whose failure mode is
  # silence: an uncaptured session produces no error, it simply never exists,
  # and nothing downstream notices. Coverage is the only mechanism that makes an
  # untested path visible before it costs someone a transcript.
  #
  # Lowering this threshold is a decision about whether transcripts may be lost
  # silently. Treat a drop as a defect, not as a number to adjust.
  # MEASURED, not aspirational. The target is 100 (docs/REQUIREMENTS.md s2) and
  # this is a RATCHET toward it: raise it whenever coverage rises, never lower it
  # to make a build pass. A drop is a defect, not a number to adjust.
  #
  # Current state, and it is a precise gap rather than diffuse thinness:
  #   library modules ......... 100% (config, cursor, gitmeta, health, lib,
  #                             parsers, sources, state, upload; reconstitute 98.96)
  #   src/bin/exporter.rs ..... 81.23%  (was 57.34% before tests/cli.rs)
  #   src/bin/reconstitute.rs . 67.57%  (no black-box tests yet - next)
  #
  # So the untested surface is the CLI entry points - argument parsing, exit
  # codes, and the stdout contract - which is exactly what REQUIREMENTS s2 says
  # needs black-box invocation tests. Those tests are the work that closes this,
  # and they are worth more than the percentage: the CLI is the contract
  # agentic-primitives' doctor and finalizer actually depend on.
  COVERAGE_MIN: "97"

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test with coverage
        run: |
          cargo llvm-cov --locked --all-features --workspace \
            --fail-under-lines "${COVERAGE_MIN}" \
            --summary-only

      # The number above gates; this makes the uncovered LINES visible in the
      # log, because "97% covered" is not actionable and "these three branches
      # are untested" is.
      - name: Report uncovered regions
        if: failure()
        run: cargo llvm-cov --locked --all-features --workspace --show-missing-lines || true

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  no-store-dependency:
    name: No store dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # docs/REQUIREMENTS.md section 1. This client must depend on the STANDARD
      # and third-party crates, never on a store implementation. The moment it
      # does, every consumer that embeds it inherits that dependency and the
      # public-standard / public-client / private-store split collapses.
      #
      # Checked mechanically because it is exactly the kind of edge that gets
      # added innocently, in a hurry, to reuse one type.
      - name: Assert no store crate is a dependency
        run: |
          set -euo pipefail
          if grep -nE '^\s*(seshmagic|.*session-store-(server|envelope))' Cargo.toml; then
            echo "::error::A store crate appears in Cargo.toml. This client must"
            echo "::error::depend on apss-v1-0004-session-capture and third-party"
            echo "::error::crates only. See docs/REQUIREMENTS.md section 1."
            exit 1
          fi
          echo "OK: no store implementation in the dependency graph"

  cross-build:
    name: Cross-build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, matching release.yml. These must stay identical: this job
          # exists so a release platform cannot fail for the first time at tag
          # time, which it can do again the moment the two lists diverge.
          - { runs-on: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runs-on: macos-14,       target: aarch64-apple-darwin }
          - { runs-on: macos-14,       target: x86_64-apple-darwin }  # cross-compiled: macos-13 starves
          - { runs-on: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # rusqlite is `bundled`, so it compiles SQLite from C source and needs a
      # musl-targeting C compiler.
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      # Every release platform must build on every PR. Discovering that Windows
      # does not compile at tag time means the release is already broken.
      - run: cargo build --locked --release --target ${{ matrix.target }}

      # The same portability assertion the release gate and the release run.
      # Here it is cheapest and earliest: a PR that would produce a binary with
      # a libc floor fails now, rather than at the gate or, as happened with
      # v0.2.0, after an image was pushed and signed.
      - name: Assert the Linux binaries are portable
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for b in $BINARIES; do
            args+=("target/${{ matrix.target }}/release/${b}")
          done
          ./scripts/assert-linux-portable.sh "${args[@]}"

  ci-success:
    name: CI Success
    if: always()
    needs: [test, lint, no-store-dependency, cross-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job reported $r"; exit 1; }
          done
